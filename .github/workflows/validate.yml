name: review-source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill-spec:
    name: agentskills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # skills-ref = Anthropic's reference validator for the Agent Skills
      # spec (agentskills.io). The installed CLI entrypoint is `agentskills`.
      - run: pip install skills-ref==0.1.1
      # Pass "$PWD", not "." — the validator matches the directory basename
      # against the skill name, and "." resolves to an empty basename.
      - run: agentskills validate "$PWD"

